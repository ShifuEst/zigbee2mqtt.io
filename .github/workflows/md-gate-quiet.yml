name: Build H2 USB-only firmware
on:
    push:
        branches: [codex/md-gate-h2-txrx01]
        paths: ['firmware-quiet/**', '.github/workflows/md-gate-quiet.yml']
permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-24.04
        container: espressif/idf:v5.5.5
        timeout-minutes: 30
        defaults:
            run:
                shell: bash
                working-directory: firmware-quiet
        steps:
            - uses: actions/checkout@v4
            - name: Build with USB console and quiet bootloader
              run: |
                  . "$IDF_PATH/export.sh"
                  idf.py set-target esp32h2
                  idf.py build
                  python build-package.py
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: MD-GATE-H2-USB
                  path: |
                      firmware-quiet/build/MD-GATE-H2-USB.bin
                      firmware-quiet/build/build-manifest.json
                      firmware-quiet/build/log/
                      firmware-quiet/sdkconfig
                      firmware-quiet/dependencies.lock
                  if-no-files-found: warn
