name: Format firmware files
on:
    push:
        branches: [codex/md-gate-h2-txrx01]
        paths: ['.github/workflows/md-gate-format.yml']
permissions:
    contents: read
jobs:
    format:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - name: Format with repository settings
              run: npx --yes prettier@3.9.6 --write .github/workflows/md-gate-firmware.yml .github/workflows/md-gate-txrx01.yml .github/workflows/md-gate-format.yml firmware-txrx01/tests/converter.test.mjs firmware-txrx01/zigbee2mqtt/md-gate-zb1.mjs
            - uses: actions/upload-artifact@v4
              with:
                  name: formatted-firmware-sources
                  include-hidden-files: true
                  path: |
                      .github/workflows/md-gate-firmware.yml
                      .github/workflows/md-gate-txrx01.yml
                      .github/workflows/md-gate-format.yml
                      firmware-txrx01/tests/converter.test.mjs
                      firmware-txrx01/zigbee2mqtt/md-gate-zb1.mjs
