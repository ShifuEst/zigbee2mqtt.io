name: Build H2 TXRX01 bench candidate
on:
    push:
        branches: [codex/md-gate-h2-txrx01]
        paths: ['firmware-txrx01/**', '.github/workflows/md-gate-txrx01.yml']
    workflow_dispatch:
permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: arduino/setup-arduino-cli@v2
              with:
                  version: '1.3.1'
            - name: Install pinned ESP32 core
              run: |
                  arduino-cli config init
                  arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
                  arduino-cli core update-index
                  arduino-cli core install esp32:esp32@3.3.12
            - name: Compile isolated bench firmware (hardware NOT validated)
              run: |
                  arduino-cli compile --jobs 2 --fqbn 'esp32:esp32:esp32h2:CDCOnBoot=cdc,PartitionScheme=zigbee_zczr,ZigbeeMode=zczr,FlashSize=4M,FlashMode=dio,DebugLevel=none' --build-property 'compiler.cpp.extra_flags=-DMD_RELAY_ACTIVE_HIGH=0 -DMD_TXRX_BENCH_ONLY=1' --output-dir build firmware-txrx01/source/MD_GATE_ZB1
            - name: Validate converter
              run: node firmware-txrx01/tests/converter.test.mjs
            - name: Record build provenance
              run: |
                  python3 - <<'PY'
                  import hashlib, json, os
                  from pathlib import Path
                  binary = Path('build/MD_GATE_ZB1.ino.merged.bin')
                  assert binary.stat().st_size == 4194304, 'Expected complete 4 MiB flash image'
                  data = {'git_commit':os.environ['GITHUB_SHA'], 'chip':'esp32h2', 'core':'3.3.12', 'profile':'BENCH_ONLY', 'hardware_verified':False, 'flash_offset':'0x0', 'sha256':hashlib.sha256(binary.read_bytes()).hexdigest(), 'pins':{'s1':24,'s2':23,'closed':0,'open':1}}
                  Path('build/build-manifest.json').write_text(json.dumps(data,indent=2)+'\n')
                  PY
            - uses: actions/upload-artifact@v4
              with:
                  name: MD-GATE-H2-TXRX01-BENCH
                  path: |
                      build/*.bin
                      build/build-manifest.json
                      firmware-txrx01/
                  if-no-files-found: error
